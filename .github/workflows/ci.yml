name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Tests
        run: pytest -q

  plugin:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate the plugin manifest
        # Both manifests live in .claude-plugin/, and the validator picks the
        # marketplace when it sees one. Isolate the plugin to check it too.
        run: |
          mkdir -p /tmp/plugin-only
          cp -r .claude-plugin plugin src pyproject.toml README.md LICENSE /tmp/plugin-only/
          rm /tmp/plugin-only/.claude-plugin/marketplace.json
          claude plugin validate /tmp/plugin-only --strict

      - name: Launcher is executable and syntax-clean
        run: |
          test -x plugin/scripts/run-server.sh || { echo "run-server.sh is not executable"; exit 1; }
          bash -n plugin/scripts/run-server.sh

  mcpb:
    name: Desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install the MCPB CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Build the bundle
        run: ./scripts/build-mcpb.sh

      - name: The bundle carries the server and nothing else
        run: |
          mcpb unpack dist/icloud-drive.mcpb /tmp/unpacked
          test -f /tmp/unpacked/manifest.json
          test -f /tmp/unpacked/icon.png
          test -f /tmp/unpacked/src/icloud_drive_mcp/server.py
          # Tests, CI config, Docker files, and the Claude Code plugin must not
          # ship to end users.
          if find /tmp/unpacked \( -path '*test*' -o -name 'Dockerfile' -o -name '*.yml' \
                                 -o -name '.mcp.json' -o -name '*.egg-info' \) | grep -q .; then
            echo "The bundle contains files that should not ship:"
            find /tmp/unpacked \( -path '*test*' -o -name 'Dockerfile' -o -name '*.yml' \
                                -o -name '.mcp.json' -o -name '*.egg-info' \) 
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: icloud-drive-mcpb
          path: dist/icloud-drive.mcpb

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t icloud-drive-mcp:ci .

      - name: The image starts and refuses an unsafe configuration
        run: |
          # No PUBLIC_URL and no credential: the server must refuse rather than
          # expose an unauthenticated iCloud Drive on a public URL.
          output=$(docker run --rm -e ICLOUD_APPLE_ID=ci@example.com icloud-drive-mcp:ci http 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "PUBLIC_URL is not set" || {
            echo "Expected the server to refuse to start without PUBLIC_URL"; exit 1; }

      - name: The CLI reports status without a session
        run: docker run --rm -e ICLOUD_APPLE_ID=ci@example.com icloud-drive-mcp:ci status || true
